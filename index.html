<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>算力远征 V0.4</title>
<style>
:root{--bg:#080c19;--panel:#101831;--text:#eef3ff;--muted:#94a4c9;--blue:#5b85ff;--red:#ff5c79;--gold:#ffd56a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(circle at top,#162249 0,#0b1125 36%,#080c19 75%)}
.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;font-size:21px}.ver{font-size:11px;color:var(--muted);margin-top:2px}.pill{font-size:12px;background:#182342;border:1px solid #334873;padding:7px 10px;border-radius:999px}
.card{background:linear-gradient(180deg,#111a34,#0d152b);border:1px solid #293a62;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 12px 32px #0006}
.enemyHead{display:flex;justify-content:space-between;align-items:center}.enemyName{font-size:18px;font-weight:900}.enemyType{font-size:12px;color:var(--muted)}.hpOuter{height:13px;border-radius:99px;background:#29324c;overflow:hidden;margin-top:11px}.hpInner{height:100%;background:linear-gradient(90deg,#ff446c,#ff7a62)}
.targetWrap{text-align:center;margin:13px 0 5px}.targetLabel{color:var(--muted);font-size:12px}.target{font-size:46px;font-weight:1000}.timer{text-align:center;font-size:29px;font-weight:950}.timer.warn{color:var(--gold)}
.rope{height:5px;background:#27314c;border-radius:99px;overflow:hidden;margin:7px 10px 13px}.ropeFill{height:100%;background:linear-gradient(90deg,#62eab1,#ffd56a,#ff5c79)}
.expr{min-height:60px;border:1px dashed #46618f;background:#0a1124;border-radius:15px;padding:12px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;font-size:22px;font-weight:900}
.token{padding:3px 7px;border-radius:8px;background:#192644}.hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.45;margin-top:9px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.numBtn{height:61px;border-radius:14px;background:#1b2c56;border:1px solid #416098;font-size:25px;font-weight:950}.numBtn.used{opacity:.24}.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.opBtn{height:51px;border-radius:14px;background:#293a64;border:1px solid #536c9f;font-size:25px;font-weight:950}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.action{height:49px;border-radius:14px;border:1px solid #3a4d78;background:#17213d;font-weight:850}.primary{background:#4d79f7}.danger{background:#351d2a}.status{min-height:23px;text-align:center;font-size:13px;color:#c5d2ef;margin-top:8px}
.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#0a1227;border-radius:13px;text-align:center;padding:9px 4px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}.rule{font-size:12px;color:#a9b7d8;line-height:1.65}.rule strong{color:#fff}
.overlay{position:fixed;inset:0;background:#050812ef;display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.modal{width:min(460px,100%);background:#111a34;border:1px solid #3b5080;border-radius:23px;padding:22px;text-align:center}.modal h2{margin:0}.big{font-size:48px;font-weight:1000;margin:7px 0}.desc{font-size:13px;color:var(--muted);line-height:1.55}.equip{display:none;margin-top:12px}.equip button{width:100%;padding:12px;margin:6px 0;border-radius:13px;border:1px solid #3d5689;background:#172542;text-align:left}.equip b{display:block}.equip span{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="logo">⚡ 算力远征</div><div class="ver">V0.4 · 解谜战斗版</div></div><div class="pill" id="floorPill"></div></div>
<section class="card">
<div class="enemyHead"><div><div class="enemyName" id="enemyName"></div><div class="enemyType" id="enemyType"></div></div><div class="pill">全数字</div></div>
<div class="hpOuter"><div class="hpInner" id="hpBar"></div></div>
<div class="targetWrap"><div class="targetLabel">🎯 目标数</div><div class="target" id="target"></div></div>
<div class="timer" id="timer"></div><div class="rope"><div class="ropeFill" id="ropeFill"></div></div>
<div class="expr" id="expr"></div>
<div class="hint">使用全部数字，每个数字只能用一次。按正常优先级：先乘除，后加减；除法必须整除。</div>
</section>
<section class="card">
<div class="nums" id="nums"></div><div class="ops" id="ops"></div>
<div class="actions"><button class="action" onclick="undo()">↩ 撤销</button><button class="action danger" onclick="clearExpr()">清空</button></div>
<div class="actions"><button class="action primary" onclick="attack()">⚔️ 提交攻击</button><button class="action" onclick="skipProblem()">🔄 换一题</button></div>
<div class="status" id="status"></div>
</section>
<section class="card"><div class="statGrid"><div class="stat"><b id="score">0</b><span>分数</span></div><div class="stat"><b id="combo">0</b><span>连击</span></div><div class="stat"><b id="shield">1</b><span>护盾</span></div><div class="stat"><b id="best">0</b><span>最高分</span></div></div></section>
<section class="card rule"><strong>玩法：</strong>把给出的数字通过 ＋ − × ÷ 精确组合成目标数。答对击败敌人，答错受惩罚；倒计时结束则本关失败。每两关可选装备，后期数字更多、目标更大、时间更短。</section>
</div>

<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><div class="big" id="modalBig"></div><div class="desc" id="modalDesc"></div><div class="equip" id="equipBox"></div><button class="action primary" id="continueBtn" style="width:100%;margin-top:15px" onclick="continueGame()">继续远征</button></div></div>

<script>
const stages=[
{n:3,time:32,min:10,max:35,name:'防火墙哨兵',type:'普通敌人'},
{n:3,time:28,min:15,max:55,name:'数据病毒',type:'普通敌人'},
{n:4,time:26,min:20,max:90,name:'吸收病毒',type:'普通敌人'},
{n:4,time:23,min:25,max:130,name:'镜像病毒',type:'精英敌人'},
{n:4,time:20,min:35,max:180,name:'高速病毒',type:'精英敌人'},
{n:5,time:19,min:40,max:260,name:'混沌防火墙',type:'精英敌人'},
{n:5,time:17,min:50,max:420,name:'零号病毒',type:'Boss'},
{n:6,time:15,min:70,max:700,name:'零号病毒·核心',type:'最终Boss'}];
let floor=1,score=0,combo=0,shield=1,best=Number(localStorage.getItem('mf04best')||0);
let problem,expr=[],used=[],remaining=0,interval,locked=false,hp=100,bonusTime=0,safeMistake=false,divisionBonus=false,pendingEquip=false,failed=false;
const $=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choice=a=>a[rand(0,a.length-1)];

function constructProblem(){
 const cfg=stages[floor-1];
 for(let t=0;t<1500;t++){
  const nums=Array.from({length:cfg.n},()=>rand(2,12)),order=[...nums].sort(()=>Math.random()-.5);
  let v=order[0],ok=true;
  for(let i=1;i<order.length;i++){
   const x=order[i],o=[];
   if(v+x<=900)o.push(v+x); if(v-x>0)o.push(v-x); if(v*x<=900)o.push(v*x); if(v%x===0&&v/x>0)o.push(v/x);
   if(!o.length){ok=false;break} v=choice(o);
  }
  if(ok&&v>=cfg.min&&v<=cfg.max)return{nums,target:v,time:cfg.time+bonusTime};
 }
 return{nums:[2,3,4],target:14,time:30+bonusTime};
}
function startFloor(){clearInterval(interval);locked=false;failed=false;hp=100;expr=[];used=[];problem=constructProblem();remaining=problem.time;render();startTimer()}
function render(){
 const cfg=stages[floor-1];$('floorPill').textContent=`第 ${floor} / 8 关`;$('enemyName').textContent=cfg.name;$('enemyType').textContent=cfg.type;$('target').textContent=problem.target;$('hpBar').style.width=hp+'%';
 $('timer').textContent=remaining.toFixed(1);$('timer').className='timer'+(remaining<=5?' warn':'');$('ropeFill').style.width=Math.max(0,remaining/problem.time*100)+'%';
 $('score').textContent=score;$('combo').textContent=combo;$('shield').textContent=shield;$('best').textContent=best;
 $('expr').innerHTML=expr.length?expr.map(x=>`<span class="token">${x}</span>`).join(''):'请选择第一个数字';
 const n=$('nums');n.innerHTML='';problem.nums.forEach((x,i)=>{let b=document.createElement('button');b.className='numBtn'+(used.includes(i)?' used':'');b.textContent=x;b.onclick=()=>pickNum(i);n.appendChild(b)});
 const o=$('ops');o.innerHTML='';['+','−','×','÷'].forEach(x=>{let b=document.createElement('button');b.className='opBtn';b.textContent=x;b.onclick=()=>pickOp(x);o.appendChild(b)});
}
function pickNum(i){if(locked||used.includes(i))return;let need=expr.length===0||['+','−','×','÷'].includes(expr.at(-1));if(!need)return say('先选运算符');used.push(i);expr.push(String(problem.nums[i]));render()}
function pickOp(x){if(locked||!expr.length||['+','−','×','÷'].includes(expr.at(-1))||used.length>=problem.nums.length)return;expr.push(x);render()}
function undo(){if(locked||!expr.length)return;let x=expr.pop();if(!['+','−','×','÷'].includes(x))used.pop();render()}
function clearExpr(){if(!locked){expr=[];used=[];render()}}
function skipProblem(){if(locked)return;combo=0;score=Math.max(0,score-30);startFloor();say('换题：-30 分，连击清零')}

function evaluate(){
 if(used.length!==problem.nums.length||expr.length!==problem.nums.length*2-1)return{ok:false,reason:'必须使用全部数字'};
 const vals=[],ops=[];expr.forEach((x,i)=>(i%2===0?vals:ops).push(x));
 let stack=[Number(vals[0])],low=[],usedDivision=false;
 for(let i=0;i<ops.length;i++){let op=ops[i],x=Number(vals[i+1]);if(op==='×'||op==='÷'){let a=stack.pop();if(op==='÷'){usedDivision=true;if(x===0||a%x!==0)return{ok:false,reason:'除法必须整除'};stack.push(a/x)}else stack.push(a*x)}else{stack.push(x);low.push(op)}}
 let total=stack[0];for(let i=0;i<low.length;i++)total=low[i]==='+'?total+stack[i+1]:total-stack[i+1];return{ok:true,value:total,usedDivision};
}
function attack(){
 if(locked)return;let r=evaluate();if(!r.ok)return say('⚠️ '+r.reason);
 if(r.value!==problem.target){combo=0;if(safeMistake){safeMistake=false;say(`🛡️ 容错挡住反击：${r.value} ≠ ${problem.target}`)}else if(shield>0){shield--;say(`🛡️ 护盾抵挡反击：${r.value} ≠ ${problem.target}`)}else{score=Math.max(0,score-50);say(`❌ ${r.value} ≠ ${problem.target}，-50 分`)}render();return}
 locked=true;clearInterval(interval);hp=0;let gain=100+Math.floor(remaining*9)+combo*35;if(divisionBonus&&r.usedDivision)gain=Math.floor(gain*1.5);combo++;score+=gain;if(score>best){best=score;localStorage.setItem('mf04best',best)}render();pendingEquip=[2,4,6].includes(floor);openModal('攻击成功！','+'+gain,`剩余 ${remaining.toFixed(1)} 秒 · 连击 ×${combo}`,false)
}
function timeOut(){if(locked)return;locked=true;failed=true;clearInterval(interval);combo=0;openModal('时间耗尽','MISS','烧绳结束，重新挑战本关。',true)}
function startTimer(){interval=setInterval(()=>{if(locked)return;remaining=Math.max(0,remaining-.1);render();if(remaining<=0)timeOut()},100)}
function openModal(t,b,d,fail){$('modalTitle').textContent=t;$('modalBig').textContent=b;$('modalDesc').textContent=d;$('equipBox').style.display='none';$('equipBox').innerHTML='';$('continueBtn').textContent=fail?'重新挑战':'继续远征';if(pendingEquip&&!fail)showEquip();$('overlay').style.display='flex'}
function showEquip(){
 let all=[
 {name:'⏱ 超频芯片',desc:'之后每关 +3 秒',apply:()=>bonusTime+=3},
 {name:'🛡 容错模块',desc:'下一次算错不受惩罚',apply:()=>safeMistake=true},
 {name:'🔋 备用护盾',desc:'立即获得 1 层护盾',apply:()=>shield++},
 {name:'☢ 危险除法',desc:'用 ÷ 正确解题，得分 ×1.5',apply:()=>divisionBonus=true}
 ].sort(()=>Math.random()-.5).slice(0,3);
 let box=$('equipBox');box.style.display='block';all.forEach(e=>{let b=document.createElement('button');b.innerHTML=`<b>${e.name}</b><span>${e.desc}</span>`;b.onclick=()=>{e.apply();pendingEquip=false;box.innerHTML=`<div class="desc">已获得：<b>${e.name}</b></div>`};box.appendChild(b)})
}
function continueGame(){$('overlay').style.display='none';if(failed)return startFloor();if(pendingEquip){$('overlay').style.display='flex';return say('先选择一个装备')};if(floor>=8){floor=1;score=0;combo=0;shield=1;bonusTime=0;safeMistake=false;divisionBonus=false;startFloor();say('🎉 远征完成！开启新一轮')}else{floor++;startFloor()}}
function say(t){$('status').textContent=t;setTimeout(()=>{if($('status').textContent===t)$('status').textContent=''},2200)}
startFloor();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
